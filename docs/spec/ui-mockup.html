<style>

ft}.table th{color:#a2a2a0;font-size:11px;font-weight:480;padding:13px 12px}.table td{padding:17px 12px;font-size:12px}.table tbody tr:hover{background:#fafaf8;cursor:pointer}.event{font-weight:550;font-size:13px}.eventMeta{font-size:11px;color:#a0a09e;margin-top:2px}.chip{display:inline-block;border-radius:6px;padding:5px 8px;background:#f2f2f0;color:#666;font-size:10px}.chip.on{background:#e9f4ee;color:#288365}.chip.warn{background:#f8f0df;color:#a67b28}.bar{background:#efefed;height:5px;overflow:hidden;border-radius:9px;margin-top:9px}.bar>i{display:block;height:100%;background:#555;border-radius:9px}.chart{height:230px;position:relative;overflow:hidden;display:flex;align-items:end;background:linear-gradient(transparent 24%,#f3f3f1 25%,transparent 25.2%,transparent 49%,#f3f3f1 50%,transparent 50.2%,transparent 74%,#f3f3f1 75%,transparent 75.2%)}.chart svg{width:100%;height:100%}.chartLabel{position:absolute;top:13px;left:12px;font-size:23px;letter-spacing:-.04em}.chartSub{font-size:11px;color:#999}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fieldLabel{display:block;color:#979795;font-size:11px;margin-bottom:7px}.field{border:0;background:#f5f5f3;border-radius:9px;padding:12px 13px;width:100%;outline:0;font-size:13px}.select{appearance:none}.seg{display:flex;background:#f4f4f2;padding:4px;border-radius:10px;gap:4px;margin:15px 0 19px}.seg button{flex:1;background:transparent;border:0;border-radius:8px;padding:10px;color:#8d8d8a}.seg button.active{background:white;color:#222;box-shadow:0 2px 5px #00000009}.range{width:100%;accent-color:#202020;margin:18px 0}.rangeLabels{display:flex;justify-content:space-between;color:#999;font-size:11px}.summary{background:#f7f7f5;border-radius:11px;padding:18px;margin:18px 0}.sumrow{display:flex;justify-content:space-between;margin:8px 0;font-size:12px}.sumrow span:first-child{color:#8b8b89}.callout{background:#f6f5f1;padding:16px;border-radius:11px;color:#6d6d67;font-size:12px;margin-top:18px}.actionRow{display:flex;gap:8px}.actionRow>*{flex:1}.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.timeline .step{background:#f5f5f3;border-radius:9px;padding:12px;color:#999;font-size:11px}.timeline .step b{display:block;color:#282828;font-weight:550;font-size:12px}.toggle{width:34px;height:19px;border-radius:15px;background:#dededb;border:0;padding:3px;display:inline-flex;align-items:center;vertical-align:middle}.toggle i{width:13px;height:13px;background:white;border-radius:100%;transition:transform .2s}.toggle.on{background:#222}.toggle.on i{transform:translateX(15px)}.adminGrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.config{padding:22px;background:white;border-radius:14px}.confighead{display:flex;align-items:start;justify-content:space-between;gap:14px}.confighead h3{margin:0;font-size:15px;font-weight:570}.confighead p{margin:5px 0 18px;color:#999;font-size:11px}.configLine{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:11px 0;font-size:12px}.configLine .key{color:#8c8c89}.configLine .val{font-weight:550}.configLine input{max-width:125px;text-align:right}.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:#696969;font-size:11px}.toast{position:fixed;bottom:26px;right:28px;padding:13px 19px;border-radius:10px;background:#242424;color:white;font-size:12px;box-shadow:0 10px 30px #0002;z-index:100}.empty{padding:45px 0;color:#aaa;font-size:13px;text-align:center}.footnote{margin-top:28px;color:#aaa;font-size:11px}.spark{width:76px;height:28px}.clickable{cursor:pointer}.hide{display:none!important}.modalBack{position:fixed;inset:0;background:#1118;display:grid;place-items:center;z-index:30;padding:18px}.modal{background:white;border-radius:18px;width:min(480px,100%);padding:29px}.modal h2{font-weight:450;letter-spacing:-.04em;margin:0 0 9px}.modal p{font-size:12px;color:#888}.marketHero{display:flex;align-items:center;justify-content:space-between;gap:14px}.link{border:0;background:none </style></head><body><div id="app" class="app"><aside class="sidebar"><div class="brand"><span class="mark">◒</span>basis<span style="font-size:10px;color:#aaa;letter-spacing:0;font-weight:500;margin-left:-4px">AMM</span></div><div class="sectionLabel">Trade</div><div class="nav" id="nav1"></div><div class="sectionLabel">Protocol</div><div class="nav" id="nav2"></div><div class="sectionLabel">Management</div><div class="nav" id="nav3"></div><div class="sidebarFoot"><div><span class="statusdot"></span>All systems operational</div><div class="profile"><span class="avatar">JO</span><span>Joshua Okolo<br><small style="color:#aaa">Admin workspace</small></span></div></div></aside><main class="main"><header class="top"><div class="breadcrumb">Basis <span style="padding:0 8px;color:#ccc">/</span> <strong id="crumb">Markets</strong></div><div class="topright"><span>NEAR Mainnet <span style="color:#26a474">●</span></span><button class="pill" onclick="toast('Wallet connection is a mockup')">0x71…2a8f ⌄</button></div></header><div class="page" id="content"></div></main></div><div id="overlay"></div><div id="toast"></div>
<script>
const markets=[{id:0,title:'Will Bitcoin be above $100,000 on Nov 30?',kind:'Crypto',source:'Polymarket',p:.63,vol:'$2.8m',liq:'$184k',lev:5,close:'Nov 30',risk:36,condition:'Standard trading',status:'Active'},{id:1,title:'Will the Fed cut rates in December?',kind:'Economics',source:'Polymarket',p:.72,vol:'$1.4m',liq:'$92k',lev:4,close:'Dec 18',risk:53,condition:'Reduced leverage near announcement',status:'Active'},{id:2,title:'Will the Boston Celtics win tonight?',kind:'Sports',source:'Polymarket',p:.57,vol:'$918k',liq:'$48k',lev:3,close:'Tonight',risk:78,condition:'No new opens during live play',status:'Close only'},{id:3,title:'Will Democrats win the 2028 election?',kind:'Politics',source:'Polymarket',p:.51,vol:'$3.2m',liq:'$227k',lev:3,close:'2028',risk:21,condition:'Event-adaptive risk limits',status:'Active'},{id:4,title:'Will ETH outperform BTC this week?',kind:'Crypto',source:'Polymarket',p:.44,vol:'$670k',liq:'$65k',lev:4,close:'Sunday',risk:28,condition:'Standard trading',status:'Active'}];
let page='markets',selected=markets[0],side='YES',margin=100,leverage=3,partial=true,category='All',mode='Trader',adminTab='Markets',vaultTab='Overview',chartPeriod='1M',orderTab='Open';const $=id=>document.getElementById(id);const fmt=n=>'$'+Math.round(n).toLocaleString();const money=n=>'$'+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const navs=[[['markets','◈','Markets'],['trade','↗','Trade'],['positions','◫','Positions'],['portfolio','◉','Portfolio']],[['vault','◌','Liquidity vault'],['stats','▥','Public statistics'],['activity','≡','Activity']],[['admin','⚙','Admin console'],['risk','⌁','Risk monitor'],['settings','⋯','Settings']]];
function navigate(p){page=p;render();window.scrollTo(0,0)}function toast(s){$('toast').innerHTML='<div class="toast">'+s+'</div>';setTimeout(()=>$('toast').innerHTML='',2800)}function heading(t,sub,button=''){return `<div class="heading"><div><div class="eyebrow">Basis / ${mode==='Admin'?'Operations':'Protocol'}</div><h1>${t}</h1><p>${sub}</p></div>${button}</div>`}function card(label,value,sub=''){return `<div class="metric"><div class="label">${label}</div><div class="value number">${value}</div><div class="detail">${sub}</div></div>`}function chart(color='#2d8b75'){const pts=[18,24,22,29,25,36,32,34,31,39,45,41,52,47,60,57,62,58,67,65,74,71,80,76,87].map((v,i)=>`${i*25},${180-v*1.55}`).join(' ');return `<div class="chart"><svg viewBox="0 0 600 220" preserveAspectRatio="none"><defs><linearGradient id="area" x1="0" x2="0" y1="0" y2="1"><stop stop-color="${color}" stop-opacity=".17"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><polygon points="0,220 ${pts} 600,220" fill="url(#area)"/><polyline points="${pts}" stroke="${color}" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/></svg></div>`}function spark(){return `<svg class="spark" viewBox="0 0 80 27"><polyline points="0,22 10,19 20,21 31,12 40,16 49,8 61,10 70,4 80,6" fill="none" stroke="#398b74" stroke-width="1.5"/></svg>`}function tableHead(a){return '<thead><tr>'+a.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead>'}function marketRows(filter='All'){return markets.filter(m=>filter==='All'||m.kind===filter).map(m=>`<tr onclick="selected=markets[${m.id}];navigate('trade')"><td><div class="event">${m.title}</div><div class="eventMeta">${m.kind} · ${m.source} · ${m.close}</div></td><td><span class="number">${Math.round(m.p*100)}¢</span></td><td>${m.vol}</td><td>${m.liq}</td><td>${m.lev}×</td><td><span class="chip ${m.status==='Active'?'on':'warn'}">${m.status}</span></td><td>↗</td></tr>`).join('')}
function marketsPage(){return heading('Discover markets','Trade leveraged outcomes across the world.',`<button class="secondary" onclick="navigate('stats')">Explore protocol ↗</button>`)+`<div class="metricRow">${card('Available markets','128','Across 7 event categories')}${card('24h volume','$4.82m','<span class="green">↑ 12.8%</span> vs yesterday')}${card('Open interest','$8.41m','Synthetic exposure')}${card('Vault utilization','36.2%','Within risk limits')}</div><div class="surface"><div style="display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:15px"><div class="surfaceTitle" style="margin:0">Prediction markets</div><input class="search" style="max-width:260px" placeholder="Search an event or market…" oninput="searchTable(this.value)"></div><div class="subnav" id="cats">${['All','Crypto','Sports','Politics','Economics'].map(x=>`<button class="${category===x?'active':''}" onclick="category='${x}';render()">${x}</button>`).join('')}</div><div class="scrollX"><table class="table" id="marketsTable">${tableHead(['Market','Probability','Volume','Liquidity','Max leverage','Access',''])}<tbody>${marketRows(category)}</tbody></table></div><div class="footnote">Illustrative market data only. Eligibility, leverage and trading restrictions are market-specific, versioned policies.</div></div>`}function searchTable(s){document.querySelector('#marketsTable tbody').innerHTML=markets.filter(m=>m.title.toLowerCase().includes(s.toLowerCase())).map(m=>marketRowsOne(m)).join('')}function marketRowsOne(m){return `<tr onclick="selected=markets[${m.id}];navigate('trade')"><td><div class="event">${m.title}</div><div class="eventMeta">${m.kind} · ${m.source}</div></td><td>${Math.round(m.p*100)}¢</td><td>${m.vol}</td><td>${m.liq}</td><td>${m.lev}×</td><td>${m.status}</td><td>↗</td></tr>`}
function tradePage(){const p=side==='YES'?selected.p:1-selected.p,notional=margin*leverage,units=notional/p,win=units*(1-p),liq=Math.max(.01,p*(1-1/leverage+.08));return heading('Trade outcome','Synthetic exposure, backed by Basis liquidity.',`<button class="secondary" onclick="showRules()">Market rules ↗</button>`)+`<div class="cols"><div><div class="surface"><div class="marketHero"><div><div class="eyebrow">${selected.kind} · ${selected.source}</div><h2 style="font-size:25px;font-weight:440;letter-spacing:-.045em;line-height:1.3;max-width:570px;margin:12px 0">${selected.title}</h2></div><button class="mini" onclick="navigate('markets')">Change event ⌄</button></div><div style="display:flex;gap:27px;margin:22px 0 5px;color:#999;font-size:12px"><span>YES <strong style="color:#222;font-size:19px;font-weight:500;margin-left:6px">${Math.round(selected.p*100)}¢</strong></span><span>NO <strong style="color:#222;font-size:19px;font-weight:500;margin-left:6px">${Math.round((1-selected.p)*100)}¢</strong></span><span>Volume <strong style="color:#222;font-weight:500;margin-left:6px">${selected.vol}</strong></span></div>${chart('#333')}<div class="subnav" style="margin-bottom:0">${['1H','1D','1W','1M','ALL'].map(x=>`<button class="${chartPeriod===x?'active':''}" onclick="chartPeriod='${x}';render()">${x}</button>`).join('')}</div></div><div class="surface" style="margin-top:18px"><div class="surfaceTitle">How this market trades</div><div class="timeline"><div class="step">01<b>Price verified</b></div><div class="step">02<b>Risk reserved</b></div><div class="step">03<b>Position opened</b></div><div class="step">04<b>Close / resolve</b></div></div><div class="callout">${selected.condition}. Final settlement follows the underlying event. No forced +100% take-profit; equity can continue appreciating until you close, are liquidated, or the event resolves.</div></div></div><div><div class="surface"><div class="surfaceTitle">Open position</div><div class="seg"><button class="${side==='YES'?'active':''}" onclick="side='YES';render()">Long YES</button><button class="${side==='NO'?'active':''}" onclick="side='NO';render()">Long NO</button></div><label class="fieldLabel">Collateral (USDC)</label><input class="field" type="number" min="10" max="100000" value="${margin}" oninput="margin=Math.max(1,+this.value||1);updatePreview()"><div style="display:flex;justify-content:space-between;margin-top:21px"><span class="fieldLabel">Leverage</span><strong id="levLabel">${leverage}×</strong></div><input class="range" type="range" min="1" max="${selected.lev}" step="1" value="${leverage}" oninput="leverage=+this.value;updatePreview()"><div class="rangeLabels"><span>1×</span><span>Market max ${selected.lev}×</span></div><div class="summary"><div class="sumrow"><span>Position notional</span><strong id="notional">${money(notional)}</strong></div><div class="sumrow"><span>Entry probability</span><strong>${Math.round(p*100)}¢</strong></div><div class="sumrow"><span>Est. liquidation price</span><strong id="liq">${Math.round(liq*100)}¢</strong></div><div class="sumrow"><span>Maximum loss</span><strong id="maxloss" class="red">${money(margin)}</strong></div><div class="sumrow"><span>Potential profit at resolution</span><strong id="profit" class="green">+${money(win)}</strong></div><div class="sumrow"><span>Opening fee (illustrative)</span><strong id="fee">${money(notional*.001)}</strong></div></div><div class="configLine"><span>Allow partial fills <small style="color:#aaa">(default on)</small></span><button class="toggle ${partial?'on':''}" onclick="partial=!partial;render()"><i></i></button></div><button style="width:100%;margin-top:15px" class="primary" onclick="toast('Demo order preview only — no transaction submitted')">Preview ${side} position</button><div class="footnote" style="line-height:1.6">No real funds or orders. Execution requires a fresh oracle, a valid market policy and available counterparty reserves.</div></div></div></div>`}function updatePreview(){const p=side==='YES'?selected.p:1-selected.p,n=margin*leverage;$('notional').textContent=money(n);$('levLabel').textContent=leverage+'×';$('liq').textContent=Math.round(Math.max(.01,p*(1-1/leverage+.08))*100)+'¢';$('maxloss').textContent=money(margin);$('profit').textContent='+'+money(n/p*(1-p));$('fee').textContent=money(n*.001)}
function positionsPage(){return heading('Your positions','Open synthetic positions and realized performance.',`<button class="secondary" onclick="navigate('trade')">+ New position</button>`)+`<div class="metricRow">${card('Account equity','$14,285.40','Across 3 active markets')}${card('Unrealized P&L','<span class="green">+$1,182.10</span>','+9.02% on posted margin')}${card('Posted margin','$6,240.00','Isolated collateral')}${card('Available balance','$8,045.40','USDC')}</div><div class="surface"><div class="subnav">${['Open','History','Orders'].map(x=>`<button class="${orderTab===x?'active':''}" onclick="orderTab='${x}';render()">${x}</button>`).join('')}</div>${orderTab==='Open'?`<div class="scrollX"><table class="table">${tableHead(['Position','Leverage','Entry','Mark','Margin','Unrealized P&L','Action'])}<tbody><tr><td><div class="event">BTC above $100k · YES</div><div class="eventMeta">Nov 30 · Crypto</div></td><td>5×</td><td>52¢</td><td>63¢</td><td>$1,500</td><td class="green">+$1,586.54</td><td><button class="mini" onclick="toast('Close order mockup')">Close</button></td></tr><tr><td><div class="event">Fed December rate cut · NO</div><div class="eventMeta">Dec 18 · Economics</div></td><td>3×</td><td>32¢</td><td>28¢</td><td>$2,400</td><td class="red">−$900.00</td><td><button class="mini" onclick="toast('Close order mockup')">Close</button></td></tr><tr><td><div class="event">2028 election · YES</div><div class="eventMeta">Politics</div></td><td>2×</td><td>48¢</td><td>51¢</td><td>$2,340</td><td class="green">+$495.56</td><td><button class="mini" onclick="toast('Close order mockup')">Close</button></td></tr></tbody></table></div>`:`<div class="empty">${orderTab==='Orders'?'No resting orders. Basis-AMM is pool-counterparty, not an order book.':'Closed positions will appear here.'}</div>`}</div>`}function portfolioPage(){return heading('Portfolio','Balances, collateral and performance.')+`<div class="metricRow">${card('Total balance','$18,942.26','Wallet and protocol')}${card('Available USDC','$8,045.40','Ready to trade')}${card('Margin in use','$6,240.00','3 isolated positions')}${card('bLP balance','$4,656.86','Liquidity vault')}</div><div class="colsWide"><div class="surface"><div class="surfaceTitle">Account performance</div><div style="font-size:28px;letter-spacing:-.05em">+$2,631.92 <span class="green" style="font-size:12px">+16.1%</span></div>${chart()}</div><div class="surface"><div class="surfaceTitle">Allocation</div><div class="configLine"><span class="key">Available funds</span><b>42.5%</b></div><div class="bar"><i style="width:42.5%"></i></div><div class="configLine"><span class="key">Margin</span><b>33.0%</b></div><div class="bar"><i style="width:33%;background:#999"></i></div><div class="configLine"><span class="key">LP shares</span><b>24.5%</b></div><div class="bar"><i style="width:24.5%;background:#bdbdb9"></i></div><div class="callout">USDC margin is isolated per trade. You cannot owe more than posted collateral, but counterparty risk and market resolution still apply.</div></div></div>`}
function vaultPage(){return heading('Basis liquidity','Provide collateral to earn fees and bear trader counterparty risk.',`<button class="secondary" onclick="navigate('stats')">View transparency data ↗</button>`)+`<div class="metricRow">${card('Vault NAV','$12,480,940','USDC-denominated')}${card('bLP price','$1.0842','<span class="green">+2.14%</span> 30d')}${card('Utilization','36.2%','Scenario reserved')}${card('Insurance fund','$842,000','Separately accounted')}</div><div class="cols"><div><div class="surface"><div class="surfaceTitle">Vault performance</div><div style="display:flex;justify-content:space-between"><div><div style="font-size:29px;letter-spacing:-.05em">$1.0842</div><div class="muted" style="font-size:11px">bLP / USDC</div></div><div class="green">+8.42% since inception</div></div>${chart('#3e826b')}<div class="subnav">${['1W','1M','3M','ALL'].map(x=>`<button class="${chartPeriod===x?'active':''}" onclick="chartPeriod='${x}';render()">${x}</button>`).join('')}</div></div><div class="surface" style="margin-top:18px"><div class="surfaceTitle">Where LP capital is exposed</div>${[['Crypto','41%'],['Politics','24%'],['Economics','20%'],['Sports','15%']].map(x=>`<div class="configLine"><span>${x[0]}</span><span>${x[1]}</span></div><div class="bar"><i style="width:${x[1]}"></i></div>`).join('')}<div class="callout">LPs bear synthetic trader gains, unhedged outcome risk, optional hedge losses and insolvency risk. Yield is variable and never guaranteed.</div></div></div><div><div class="surface"><div class="surfaceTitle">Manage liquidity</div><div class="seg"><button class="${vaultTab==='Overview'?'active':''}" onclick="vaultTab='Overview';render()">Deposit</button><button class="${vaultTab==='Withdraw'?'active':''}" onclick="vaultTab='Withdraw';render()">Withdraw</button></div><label class="fieldLabel">Amount (USDC)</label><input class="field" type="number" placeholder="0.00" id="vaultAmount"><div class="summary"><div class="sumrow"><span>bLP price</span><b>$1.0842</b></div><div class="sumrow"><span>${vaultTab==='Overview'?'You receive':'Estimated USDC'}</span><b>—</b></div><div class="sumrow"><span>Withdrawals</span><b>Queue based</b></div></div><button class="primary" style="width:100%" onclick="toast('Liquidity action preview only')">${vaultTab==='Overview'?'Deposit USDC':'Request withdrawal'}</button><div class="footnote">Withdrawals may queue while capital is reserved against open synthetic liabilities.</div></div></div></div>`}
function statsPage(){return heading('Protocol statistics','Public, verifiable exposure and liquidity metrics.',`<button class="secondary" onclick="toast('Export preview — demo values only')">Export report ↗</button>`)+`<div class="metricRow">${card('Total value locked','$13.32m','Vault and insurance')}${card('Cumulative volume','$492.8m','Synthetic notional')}${card('Open interest','$8.41m','Across admitted markets')}${card('LP share price','$1.0842','bLP / USDC')}</div><div class="colsWide"><div class="surface"><div class="surfaceTitle">Total value locked</div>${chart('#3b806e')}<div class="subnav" style="margin-bottom:0">${['7D','30D','90D','ALL'].map(x=>`<button class="${chartPeriod===x?'active':''}" onclick="chartPeriod='${x}';render()">${x}</button>`).join('')}</div></div><div class="surface"><div class="surfaceTitle">Solvency overview</div><div class="configLine"><span class="key">Vault assets</span><b>$12,480,940</b></div><div class="configLine"><span class="key">Current synthetic liabilities</span><b>$3,012,440</b></div><div class="configLine"><span class="key">Stress capital reserved</span><b>$4,518,230</b></div><div class="configLine"><span class="key">Insurance fund</span><b>$842,000</b></div><div class="configLine"><span class="key">Available unencumbered capital</span><b>$3,641,800</b></div><div class="callout">The reserve is a scenario-based capital encumbrance, not an immediate balance-sheet loss. Values shown are illustrative and must be reconciled against contract state in production.</div></div></div><div class="colsWide" style="margin-top:20px"><div class="surface"><div class="surfaceTitle">Open interest by category</div>${[['Crypto','$3.44m','41'],['Politics','$2.02m','24'],['Economics','$1.68m','20'],['Sports','$1.27m','15']].map(x=>`<div class="configLine"><span>${x[0]}</span><b>${x[1]}</b></div><div class="bar"><i style="width:${x[2]}%"></i></div>`).join('')}</div><div class="surface"><div class="surfaceTitle">Protocol earnings · 30 days</div>${[['Opening fees','$31,820'],['Holding fees','$18,442'],['Closing fees','$8,240'],['Liquidation fees','$1,920'],['LP net P&L','+$14,880']].map(x=>`<div class="configLine"><span class="key">${x[0]}</span><b>${x[1]}</b></div>`).join('')}<div class="footnote">Fees do not imply guaranteed yield or protection from adverse trader results.</div></div></div>`}
function activityPage(){return heading('Activity','A live-style audit trail of trading and governance actions.')+`<div class="surface"><div class="subnav">${['All','Trades','Liquidations','Vault','Governance'].map(x=>`<button class="${category===x?'active':''}" onclick="category='${x}';render()">${x}</button>`).join('')}</div><div class="scrollX"><table class="table">${tableHead(['Event','Market / details','Amount','Timestamp','Status'])}<tbody>${[['Position opened','BTC above $100k · YES','$1,500','2 minutes ago'],['Margin increased','Fed rate cut · NO','$240','14 minutes ago'],['bLP minted','Liquidity deposit','$12,800','27 minutes ago'],['Market policy updated','Celtics game · close only','—','46 minutes ago'],['Liquidation completed','ETH vs BTC · YES','$860','1 hour ago'],['Resolution verified','Fed funds range','$2,920','3 hours ago']].filter(x=>category==='All'||category==='Trades'||category==='Governance').map(x=>`<tr><td><div class="event">${x[0]}</div></td><td class="muted">${x[1]}</td><td>${x[2]}</td><td class="muted">${x[3]}</td><td><span class="chip on">Verified</span></td></tr>`).join('')}</tbody></table></div></div>`}
function riskPage(){return heading('Risk monitor','Operator overview of pool exposure and emergency capacity.',`<button class="secondary" onclick="toast('Risk report preview generated')">Download snapshot ↗</button>`)+`<div class="metricRow">${card('Free stress capacity','$3.64m','Unreserved capital')}${card('Portfolio VaR','$1.12m','99% model estimate')}${card('Highest event exposure','2.8%','Of vault NAV')}${card('Oracle anomalies','2','<span class="red">Needs review</span>')}</div><div class="colsWide"><div class="surface"><div class="surfaceTitle">Market risk ledger</div><div class="scrollX"><table class="table">${tableHead(['Market','Utilization','Stress loss','Policy'])}<tbody>${markets.map(m=>`<tr><td><div class="event">${m.title}</div></td><td><div>${m.risk}%</div><div class="bar" style="min-width:80px"><i style="width:${m.risk}%"></i></div></td><td>${fmt(m.risk*820)}</td><td><span class="chip ${m.risk>70?'warn':'on'}">${m.risk>70?'Elevated':'Normal'}</span></td></tr>`).join('')}</tbody></table></div></div><div class="surface"><div class="surfaceTitle">Risk alerts</div>${[['High utilization','Celtics market is using 78% of event stress allocation','Review policy'],['Price source divergence','BTC market mark disagrees across sources by 1.9¢','Inspect oracle'],['Upcoming catalyst','Fed decision approaches policy re-evaluation window','View configuration']].map(x=>`<div style="padding:15px 0"><div class="event">${x[0]}</div><div class="muted" style="font-size:12px;margin:3px 0 10px">${x[1]}</div><button class="link" onclick="navigate('admin')">${x[2]} ↗</button></div>`).join('')}</div></div>`}
function adminPage(){return heading('Administration','Versioned market admission, strategies and protocol controls.',`<button class="primary" onclick="showModal('Create market policy','Choose a market descriptor and audited strategy adapter. Changes require review, simulation, approval and a signed policy epoch.')">+ New policy</button>`)+`<div class="subnav">${['Markets','Risk & leverage','Fees','Oracles','Hedges','Vault','Governance'].map(x=>`<button class="${adminTab===x?'active':''}" onclick="adminTab='${x}';render()">${x}</button>`).join('')}</div>${adminTab==='Markets'?`<div class="surface"><div style="display:flex;justify-content:space-between;align-items:center"><div class="surfaceTitle">Market policies</div><span class="muted" style="font-size:11px">4 active · 1 restricted</span></div><div class="scrollX"><table class="table">${tableHead(['Market','Adapter','Policy epoch','Max leverage','State',''])}<tbody>${markets.map(m=>`<tr><td><div class="event">${m.title}</div><div class="eventMeta">${m.kind} · ${m.source}</div></td><td class="code">polymarket_ctf_v1</td><td>v${m.id+12}.0</td><td>${m.lev}×</td><td><span class="chip ${m.status==='Active'?'on':'warn'}">${m.status}</span></td><td><button class="mini" onclick="selected=markets[${m.id}];showRules(true)">Configure ↗</button></td></tr>`).join('')}</tbody></table></div><div class="callout">Markets are configurable descriptors and approved strategy versions. No event category, time horizon or trading cutoff is hard-coded into NEAR contract logic.</div></div>`:adminTab==='Risk & leverage'?`<div class="adminGrid"><div class="config"><div class="confighead"><div><h3>Global exposure budget</h3><p>Bound how much LP capital is exposed across correlated outcomes.</p></div><span class="chip">Draft</span></div>${configInput('Max portfolio stress (% NAV)','10.0')}${configInput('Max event stress (% NAV)','2.0')}${configInput('Minimum maintenance buffer','8.0')}${configInput('Risk utilization soft limit','70.0')}<button class="primary" style="margin-top:19px" onclick="toast('Draft saved locally in mockup')">Save draft</button></div><div class="config"><div class="confighead"><div><h3>Dynamic leverage policy</h3><p>Evaluated per market, quote and actual available capital.</p></div><span class="chip on">Active</span></div>${configInput('Protocol governance ceiling','20x')}${configInput('Min adverse price increments','10')}${configInput('Oracle confidence multiplier','1.4')}${configInput('Minimum solvency headroom','1.2')}<div class="callout">Market policy may be stricter. Every quote must satisfy liquidity, jump stress, liquidation and oracle checks.</div></div></div>`:adminTab==='Fees'?`<div class="adminGrid"><div class="config"><h3>Base fee schedule</h3><p class="muted">All figures sample configuration, not production calibrated.</p>${configInput('Opening fee (% notional)','0.10')}${configInput('Closing fee (% notional)','0.08')}${configInput('Holding APR (% virtual borrow)','8.50')}${configInput('Liquidation fee (% remaining equity)','1.00')}<button class="primary" style="margin-top:17px" onclick="toast('Fee draft saved in mockup')">Save fee draft</button></div><div class="config"><h3>Dynamic risk surcharges</h3><p class="muted">Fees depend on admissible model inputs per market.</p>${configInput('Utilization surcharge slope','0.25')}${configInput('Event proximity coefficient','1.50')}${configInput('Insurance fee allocation (%)','20')}${configInput('LP fee allocation (%)','70')}<div class="callout">Existing positions keep the explicitly signed fee rules; administrators cannot retroactively increase accepted fees.</div></div></div>`:adminTab==='Oracles'?`<div class="adminGrid"><div class="config"><h3>Price source policy</h3><p class="muted">Independent inputs and per-market admissibility checks.</p>${configInput('Minimum independent sources','2')}${configInput('Maximum data age (seconds)','15')}${configInput('Max source divergence (¢)','2')}${configInput('TWAP reference window (seconds)','60')}<button class="primary" style="margin-top:16px" onclick="toast('Oracle draft saved')">Save oracle policy</button></div><div class="config"><h3>Resolution adapters</h3>${[['polymarket_ctf_polygon','Healthy'],['kalshi_event_feed','Pending review'],['custom_attested_adapter','Healthy']].map(x=>`<div class="configLine"><span class="code">${x[0]}</span><span class="chip ${x[1]==='Healthy'?'on':'warn'}">${x[1]}</span></div>`).join('')}<div class="callout">A market-specific final resolution adapter must identify exact external outcome semantics and dispute handling. A TEE alone cannot declare truth.</div></div></div>`:adminTab==='Hedges'?`<div class="adminGrid"><div class="config"><h3>Strategy registry</h3><p class="muted">Each market selects its own reviewed adapter.</p>${[['POOL_ONLY','Direct vault counterparty'],['POOL_PLUS_HEDGE','Optional inventory rebalancing'],['HEDGE_REQUIRED','Confirm external hedge first']].map(x=>`<div class="configLine"><div><b>${x[0]}</b><div class="muted" style="font-size:11px">${x[1]}</div></div><span class="chip on">Available</span></div>`).join('')}<button class="secondary" onclick="showModal('New hedge adapter','Register a pinned build hash, signer budget and validated failure tests before activation.')">Register adapter</button></div><div class="config"><h3>Execution limits</h3>${configInput('Max hedge capital (% vault)','15')}${configInput('Slippage limit (basis points)','60')}${configInput('Max order retry count','3')}${configInput('Hedge proof timeout (seconds)','120')}<div class="callout">External hedging is market-specific; crypto perps are not exact hedges for binary event shares.</div></div></div>`:adminTab==='Vault'?`<div class="adminGrid"><div class="config"><h3>Liquidity controls</h3>${configInput('New deposit maximum','$1,000,000')}${configInput('Free capital floor (%)','15')}${configInput('Withdrawal queue interval (hours)','24')}${configInput('Insurance target (% NAV)','7')}<button class="primary" style="margin-top:16px" onclick="toast('Vault draft saved')">Save vault configuration</button></div><div class="config"><h3>Protocol safety switches</h3>${toggleLine('Accept new positions',true)}${toggleLine('Allow position increases',true)}${toggleLine('Allow LP withdrawals',true)}${toggleLine('Emergency close-only mode',false)}<div class="callout">Emergency controls cannot confiscate positions or silently force a profitable +100% take-profit.</div></div></div>`:`<div class="colsWide"><div class="surface"><div class="surfaceTitle">Pending approvals</div>${[['Fed rate cut policy v14','Risk reviewer · waiting','Approve'],['Crypto strategy adapter v3','Security review · waiting','Inspect'],['Insurance fee split v7','Governance vote · waiting','Review']].map(x=>`<div class="configLine"><div><div class="event">${x[0]}</div><div class="muted" style="font-size:11px">${x[1]}</div></div><button class="mini" onclick="showModal('${x[0]}','In production this action requires permissions, multisig or timelock validation, and a signed onchain policy update.')">${x[2]}</button></div>`).join('')}</div><div class="surface"><div class="surfaceTitle">Configuration integrity</div>${[['Current policy epoch','v19'],['Timelock','24 hours'],['Admin approvals','2 of 3'],['Unverified changes','0'],['Last signed update','2 hours ago']].map(x=>`<div class="configLine"><span class="key">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div></div>`}`}
function configInput(label,value){return `<div class="configLine"><span class="key">${label}</span><input class="field" value="${value}" aria-label="${label}"></div>`}function toggleLine(label,val){return `<div class="configLine"><span>${label}</span><button class="toggle ${val?'on':''}" onclick="this.classList.toggle('on')"><i></i></button></div>`}
function settingsPage(){return heading('Settings','Customize your trading workspace.')+`<div class="adminGrid"><div class="config"><h3>Trading preferences</h3>${toggleLine('Partial fills by default',true)}${toggleLine('Confirm before opening a position',true)}${toggleLine('Show advanced risk metrics',true)}${toggleLine('Notify on liquidation risk',true)}</div><div class="config"><h3>Interface</h3><div class="configLine"><span>Display currency</span><b>USD ⌄</b></div><div class="configLine"><span>Network</span><b>NEAR Mainnet ⌄</b></div><div class="configLine"><span>Theme</span><b>Light ⌄</b></div><div class="callout">This is an interactive design prototype. Preferences and transactions are not stored.</div></div></div>`}
function showRules(edit=false){$('overlay').innerHTML=`<div class="modalBack" onclick="closeModal(event)"><div class="modal"><div class="eyebrow">${edit?'Market configuration':'Market trading policy'}</div><h2 style="margin-top:12px">${selected.title}</h2><p>Versioned market-specific rules are shown before every user order.</p>${[['Current state',selected.status],['Maximum leverage',selected.lev+'×'],['Entry / exit policy',selected.condition],['Oracle adapter','polymarket_ctf_polygon'],['Resolution','Underlying venue finality'],['Available risk budget','Market-dependent'],['Partial fills','Enabled by default']].map(x=>`<div class="configLine"><span class="key">${x[0]}</span><b>${x[1]}</b></div>`).join('')}<div class="actionRow" style="margin-top:20px"><button class="secondary" onclick="$('overlay').innerHTML=''">Close</button>${edit?`<button class="primary" onclick="toast('Policy editing is demo-only');$('overlay').innerHTML=''">Edit policy</button>`:''}</div></div></div>`}function showModal(title,text){$('overlay').innerHTML=`<div class="modalBack" onclick="closeModal(event)"><div class="modal"><h2>${title}</h2><p>${text}</p><div style="text-align:right;margin-top:27px"><button class="primary" onclick="$('overlay').innerHTML=''">Done</button></div></div></div>`}function closeModal(e){if(e.target.classList.contains('modalBack'))$('overlay').innerHTML=''}
const renderers={markets:marketsPage,trade:tradePage,positions:positionsPage,portfolio:portfolioPage,vault:vaultPage,stats:statsPage,activity:activityPage,admin:adminPage,risk:riskPage,settings:settingsPage};function render(){mode=['admin','risk','settings'].includes(page)?'Admin':'Trader';navs.forEach((group,i)=>{$('nav'+(i+1)).innerHTML=group.map(([id,ico,label])=>`<button class="${page===id?'active':''}" onclick="navigate('${id}')"><span class="ico">${ico}</span>${label}</button>`).join('')});$('crumb').textContent=[...navs.flat()].find(x=>x[0]===page)?.[2]||'Markets';$('content').innerHTML=renderers[page]();if(page==='trade'&&leverage>selected.lev){leverage=selected.lev;render()}}render();
</script></body></html>
