[workspace]
resolver = "3"
members = [
  "crates/basis-math",
  "crates/oracle-tee",
  "contracts/basis-core",
  "contracts/mock-usdc",
  "contracts/mock-outlayer",
#  "tests/near-sandbox",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/numinousmuses/basis-amm"

[workspace.dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"
borsh = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
