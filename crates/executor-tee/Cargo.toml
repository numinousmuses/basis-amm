[package]
name = "executor-tee"
description = "Basis-AMM hedge executor signer for OutLayer TEE workers: signs only bounded Polymarket orders"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "executor-tee"
path = "src/main.rs"

[dependencies]
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
sha3 = "0.10"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
