[package]
name = "oracle-tee"
description = "Basis-AMM mark oracle that runs inside OutLayer's Intel TDX workers (wasm32-wasip2)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "oracle-tee"
path = "src/main.rs"

[dependencies]
borsh = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(all(target_arch = "wasm32", target_os = "wasi"))'.dependencies]
wasi-http-client = "0.2"

[dev-dependencies]
basis-core = { path = "../../contracts/basis-core" }
near-sdk = { workspace = true, features = ["unit-testing"] }
